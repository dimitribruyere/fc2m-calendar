name: Synchronisation calendrier Sportcorico

on:
  schedule:
    # Toutes les 15 minutes. GitHub peut retarder légèrement l'exécution
    # en cas de forte charge sur les runners publics, mais ça reste largement
    # suffisant pour ce cas d'usage.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install icalendar

      - name: Génération du fichier ICS
        env:
          SPORTCORICO_AUTH: ${{ secrets.SPORTCORICO_AUTH }}
        run: python3 fetch_and_convert.py

      - name: Commit et push si changement
        run: |
          git config user.name "fc2m-bot"
          git config user.email "actions@github.com"
          git add docs/fc2m.ics
          git diff --quiet --cached || git commit -m "Sync calendrier Sportcorico"
          git push
