name: Synchronisation calendrier Sportcorico

on:
  schedule:
    # Toutes les 15 minutes (GitHub peut retarder légèrement l'exécution)
    # en cas de forte charge sur les runners publics, mais ça reste largement
    # suffisant pour ce cas d'usage.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write
  id-token: write # requis pour l'authentification Google via fédération d'identité

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Génération du fichier ICS
        env:
          SPORTCORICO_AUTH: ${{ secrets.SPORTCORICO_AUTH }}
        run: python3 fetch_and_convert.py

      - name: Commit et push si changement
        run: |
          git config user.name "fc2m-bot"
          git config user.email "actions@github.com"
          git add docs/fc2m.ics
          git diff --quiet --cached || git commit -m "Sync calendrier Sportcorico"
          git push

      - name: Authentification Google Cloud (fédération d'identité, sans clé)
        # continue-on-error : test en cours, ne doit pas casser la génération du .ics
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/376874538006/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions
          service_account: fc2m-calendar-sync@project-e5768414-b87f-40ae-9d7.iam.gserviceaccount.com

      - name: Synchronisation vers Google Calendar
        continue-on-error: true
        env:
          SPORTCORICO_AUTH: ${{ secrets.SPORTCORICO_AUTH }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python3 sync_to_google_calendar.py
